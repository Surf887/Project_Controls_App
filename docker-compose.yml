services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pc
      POSTGRES_PASSWORD: pc
      POSTGRES_DB: project_controls
    ports:
      - '5432:5432'
    volumes:
      - pc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pc -d project_controls']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      DATABASE_URL: postgres://pc:pc@postgres:5432/project_controls
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run start --prefix server

  web:
    build: .
    ports:
      - '5173:5173'
    environment:
      VITE_API_BASE: http://localhost:3001/api
    command: npm run preview -- --host 0.0.0.0 --port 5173
    depends_on:
      - api

volumes:
  pc_postgres_data:
