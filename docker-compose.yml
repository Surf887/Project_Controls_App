services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your .env}
      POSTGRES_DB: ${POSTGRES_DB:-project_controls}
    # Not published to the host by default — only reachable on the compose network.
    expose:
      - '5432'
    volumes:
      - pc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pc} -d ${POSTGRES_DB:-project_controls}']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3001}:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-pc}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-project_controls}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your .env}
      JWT_ISSUER: ${JWT_ISSUER:-project-controls}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      ENFORCE_PROJECT_MEMBERSHIP: ${ENFORCE_PROJECT_MEMBERSHIP:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in your .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in your .env}
      BOOTSTRAP_PROJECT_NAME: ${BOOTSTRAP_PROJECT_NAME:?set BOOTSTRAP_PROJECT_NAME in your .env}
      BOOTSTRAP_PROJECT_ID: ${BOOTSTRAP_PROJECT_ID:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      AUDIT_HMAC_SECRET: ${AUDIT_HMAC_SECRET:?set AUDIT_HMAC_SECRET in your .env}
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:?set CREDENTIALS_KEY in your .env}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pc_postgres_data:
